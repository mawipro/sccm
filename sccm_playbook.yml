---
- name: Verify connectivity to SCCM server
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    sccm_server_ip: 172.17.74.101
    ansible_connection: local
    ansible_shell_type: sh
    ansible_shell_executable: /bin/sh
    domain_name: "sdxmecm.test"

  tasks:
    - name: Check WinRM HTTPS port (5986) from controller
      ansible.builtin.wait_for:
        host: 172.17.74.101
        port: 5986
        timeout: 10
        state: started
    
    
    - name: Check DNS resolution 1
      ansible.windows.win_powershell:
        script: |
          nslookup {{ domain_name }}
      register: dns_check
      ignore_errors: yes
      ansible_no_log: false

    - name: Check DNS resolution 2
      ansible.windows.win_powershell:
        script: |
          try {
              $result = nslookup {{ domain_name }}
              if ($result -match "Address") {
                  Write-Output "DNS_OK"
              } else {
                  throw "DNS resolution failed"
              }
          } catch {
              throw "DNS check failed: $($_.Exception.Message)"
          }
      ignore_errors: yes

