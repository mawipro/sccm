---
- name: Join Windows VM to Domain
  hosts: all
  gather_facts: false

  vars:
    # VM Details from requirements
    new_hostname: "svw-ch-appp577"
    domain_name: "sdxmecm.test"
    ou_path: "OU=Servers,DC=sdxmecm,DC=test"

  tasks:
    - name: Set computer hostname to {{ new_hostname }}
      ansible.windows.win_hostname:
        name: "{{ new_hostname }}"
      register: hostname_change

    - name: Reboot if hostname changed
      ansible.windows.win_reboot:
      when: hostname_change.reboot_required

    - name: Join domain {{ domain_name }}
      ansible.windows.win_domain_membership:
        dns_domain_name: "{{ domain_name }}"
        domain_admin_user: "{{ ansible_user }}"
        domain_admin_password: "{{ ansible_password }}"
        domain_ou_path: "{{ ou_path }}"
        state: domain
      register: domain_join

    - name: Reboot if domain join requires it
      ansible.windows.win_reboot:
      when: domain_join.reboot_required

    - name: Verify domain join status
      ansible.windows.win_powershell:
        script: |
          (Get-WmiObject Win32_ComputerSystem).Domain
      register: domain_status_check

    - name: Display current domain
      ansible.builtin.debug:
        msg: "The server is now joined to: {{ domain_status_check.output[0] }}"
