---
- name: Join Windows VM to Domain
  hosts: all
  gather_facts: false

  vars:
    # OU Path remains as it's specific to the organization structure
    #ou_path: "OU=Servers,DC=sdxmecm,DC=test"

  tasks:
    - name: Set computer hostname to match inventory name ({{ inventory_hostname }})
      ansible.windows.win_powershell:
        script: |
          hostname
          whoami
      register: hostname_change
      ignore_errors: true

    # - name: Reboot if hostname changed
    #   ansible.windows.win_reboot:
    #   when: hostname_change.reboot_required

    - name: Join domain {{ sccm_domain }} (using PowerShell)
      ansible.windows.win_shell: |
        $passwd = ConvertTo-SecureString "{{ sccm_password }}" -AsPlainText -Force
        $creds = New-Object System.Management.Automation.PSCredential ("{{ sccm_domain }}\{{ sccm_username }}", $passwd)
        
        Add-Computer -DomainName "{{ sccm_domain }}" `
                     -Credential $creds `
                     -Force `
                     -ErrorAction Stop
      
      register: domain_join_ps
      changed_when: domain_join_ps.rc == 0
      failed_when: 
        - domain_join_ps.rc != 0
        - "'is already a member of domain' not in domain_join_ps.stderr"

    - name: Reboot if domain join was successful
      ansible.windows.win_reboot:
      when: domain_join_ps.changed

    - name: Verify domain join status
      ansible.windows.win_powershell:
        script: |
          (Get-WmiObject Win32_ComputerSystem).Domain
      register: domain_status_check

    - name: Display current domain
      ansible.builtin.debug:
        msg: "The server is now joined to: {{ domain_status_check.output[0] }}"
